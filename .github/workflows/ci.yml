name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Benchmark smoke run
        run: java -jar target/minios.jar bench --processes 10000 --out bench-results
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-results/
